name: Release Package

# This action will start when a correctly formatted tag is pushed (e.g. 0.1.0)

on:
  push:
    tags:
      - "*"

jobs:
  build:

    runs-on: windows-latest

    permissions:
      contents: read
      id-token: write # Required for NuGet trusted publishing (OIDC)

    steps:

    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x

    - name: Build project
      run: dotnet build src\Umbraco.Community.Sustainability\Umbraco.Community.Sustainability.csproj --configuration Release

    - name: NuGet login (OIDC → short-lived API key)
      uses: NuGet/login@v1
      id: login
      with:
        user: ${{ secrets.NUGET_USER }}

    - name: Push to NuGet
      run: dotnet nuget push **\*.nupkg --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json
